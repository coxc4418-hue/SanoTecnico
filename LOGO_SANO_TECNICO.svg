<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a3a"/>
      <stop offset=".55" stop-color="#0f1640"/>
      <stop offset="1" stop-color="#1b1452"/>
    </linearGradient>
    <radialGradient id="glow" cx=".18" cy=".12" r=".75">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".95" cy="1" r=".6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
