    <rect x="148" y="74" width="216" height="364" rx="46" fill="#ffffff" fill-opacity=".05" stroke="url(#cy)" stroke-width="22"/>
    <rect x="224" y="100" width="64" height="12" rx="6" fill="#22d3ee"/>
    <!-- Circuito en forma de S -->
    <path d="M302 166H226q-20 0-20 20v46q0 20 20 20h60q20 0 20 20v46q0 20-20 20H210" fill="none" stroke="url(#trace)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
